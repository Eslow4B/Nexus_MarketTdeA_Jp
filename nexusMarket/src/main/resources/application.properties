spring.application.name=nexusMarket

# MySQL connection. Override with the DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
